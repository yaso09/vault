<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YT İndirici</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #fff;
    }
    .kart {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #ff4444; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #cc2222; }
    button:disabled { background: #555; cursor: not-allowed; }
    #durum { margin-top: 1rem; font-size: 0.9rem; color: #aaa; text-align: center; }
  </style>
</head>
<body>
  <div class="kart">
    <h1>▶ YouTube MP4 İndirici</h1>
    <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." />
    <button id="btn" onclick="indir()">İndir</button>
    <div id="durum"></div>
  </div>

  <script>
    async function indir() {
      const url = document.getElementById('url').value.trim()
      const btn = document.getElementById('btn')
      const durum = document.getElementById('durum')

      if (!url) return

      btn.disabled = true
      durum.textContent = 'İşleniyor...'

      try {
        // Redirect'i takip etmeden önce kontrol et
        const res = await fetch(`/api/download?url=${encodeURIComponent(url)}`, {
          redirect: 'manual'
        })

        if (res.type === 'opaqueredirect' || res.status === 302) {
          // Tarayıcıya normal indirme linki olarak yönlendir
          window.location.href = `/api/download?url=${encodeURIComponent(url)}`
          durum.textContent = 'İndirme başlatıldı ✓'
        } else {
          const veri = await res.json()
          durum.textContent = `Hata: ${veri.hata}`
        }
      } catch {
        durum.textContent = 'Bir hata oluştu.'
      } finally {
        btn.disabled = false
      }
    }
  </script>
</body>
</html>
