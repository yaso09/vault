<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YT İndirici</title>
  <!-- BotGuard/PO Token üretici -->
  <script src="https://cdn.jsdelivr.net/npm/bgutils-js@3/dist/bgutils.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #fff;
    }
    .kart {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #ff4444; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    #durum { margin-top: 1rem; font-size: 0.9rem; color: #aaa; text-align: center; min-height: 1.2em; }
  </style>
</head>
<body>
<div class="kart">
  <h1>▶ YouTube MP4 İndirici</h1>
  <input id="urlInput" type="text" placeholder="https://youtu.be/..."/>
  <button id="btn" onclick="indir()">İndir</button>
  <div id="durum"></div>
</div>

<script>
  async function poTokenUret() {
    try {
      // YouTube'dan visitor_data al
      const res = await fetch('https://www.youtube.com/sw.js_data')
      const text = await res.text()
      const match = text.match(/"visitorData":"([^"]+)"/)
      const visitorData = match?.[1]
      if (!visitorData) return {}

      // BotGuard ile PO Token üret
      const bg = await BG.BotGuardClient.create({
        program: await fetch('https://www.youtube.com/iframe_api')
          .then(r => r.text()),
        globalName: 'botguard',
      })
      const poToken = await bg.snapshot()
      return { poToken, visitorData }
    } catch {
      return {}
    }
  }

  async function indir() {
    const url = document.getElementById('urlInput').value.trim()
    const btn = document.getElementById('btn')
    const durum = document.getElementById('durum')
    if (!url) return

    btn.disabled = true
    durum.textContent = 'Token üretiliyor...'

    const { poToken, visitorData } = await poTokenUret()

    durum.textContent = 'İndirme başlatılıyor...'

    const params = new URLSearchParams({ url })
    if (poToken) params.set('poToken', poToken)
    if (visitorData) params.set('visitorData', visitorData)

    window.location.href = `/api/download?${params}`

    setTimeout(() => {
      durum.textContent = 'İndirme başlatıldı ✓'
      btn.disabled = false
    }, 2000)
  }
</script>
</body>
</html>
