<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YT İndirici</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      color: #fff;
    }
    .kart {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #ff4444; }
    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { background: #444; cursor: not-allowed; }
    #onizleme {
      display: none;
      margin-top: 1.25rem;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
    }
    #onizleme img { width: 100%; display: block; }
    .bilgi { padding: 0.75rem 1rem; }
    .baslik { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; }
    .sure { font-size: 0.8rem; color: #888; }
    #durum { margin-top: 1rem; font-size: 0.85rem; color: #aaa; text-align: center; }
  </style>
</head>
<body>
<div class="kart">
  <h1>▶ YouTube MP4 İndirici</h1>
  <input id="urlInput" type="text" placeholder="https://youtu.be/..."/>
  <select id="kalite">
    <option value="1080">1080p</option>
    <option value="720" selected>720p</option>
    <option value="480">480p</option>
    <option value="360">360p</option>
  </select>
  <button id="btn" onclick="indir()">İndir</button>
  <div id="onizleme">
    <img id="thumb" src="" alt=""/>
    <div class="bilgi">
      <div id="baslik" class="baslik"></div>
      <div id="sure" class="sure"></div>
    </div>
  </div>
  <div id="durum"></div>
</div>

<script>
  const $ = id => document.getElementById(id)

  function sureFormat(sn) {
    const d = Math.floor(sn / 60), s = sn % 60
    return `${d}:${String(s).padStart(2, '0')}`
  }

  async function indir() {
    const url = $('urlInput').value.trim()
    const kalite = $('kalite').value
    if (!url) return

    $('btn').disabled = true
    $('durum').textContent = 'Bilgi alınıyor...'
    $('onizleme').style.display = 'none'

    try {
      const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`)
      const data = await res.json()

      if (data.hata) {
        $('durum').textContent = `Hata: ${data.hata}`
        $('btn').disabled = false
        return
      }

      $('thumb').src = data.thumbnail
      $('baslik').textContent = data.baslik
      $('sure').textContent = sureFormat(data.sure)
      $('onizleme').style.display = 'block'
      $('durum').textContent = 'İndirme başlatılıyor...'

      window.location.href =
        `/api/download?url=${encodeURIComponent(url)}&kalite=${kalite}`

      setTimeout(() => {
        $('durum').textContent = 'İndirme başlatıldı ✓'
        $('btn').disabled = false
      }, 2000)

    } catch (err) {
      $('durum').textContent = `Hata: ${err.message}`
      $('btn').disabled = false
    }
  }
</script>
</body>
</html>
