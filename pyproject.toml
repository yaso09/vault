[project]
name = "vault"
version = "0.2.0"
description = "Video Archive App"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flet>=0.85.2",
    "flet-webview>=0.85.2",
    "pywebview>=6.2.1",
    "yt-dlp>=2026.3.17",
]

# ── Flet Build Konfigürasyonu ────────────────────────────────────
# Bu bölüm `flet build android` komutunun varsayılanlarını tanımlar.
# Org + product birleşimi Android'deki paket adını oluşturur:
#   com.yasireymen.vault
[tool.flet]
org = "com.yasireymen"
product = "Vault"
description = "Video archive app"

[tool.flet.android]
# Yalnızca INTERNET gerekli; app-özel dizine yazarken ek izin gerekmez.
permissions = [
    "android.permission.INTERNET",
]
