name: Build Flet App

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UV_PYTHON: 3.13
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:

  # ── Sadece bir kez, sadece Linux'ta build edilir ──────────────────────────
  build-ffmpeg-wasm:
    name: Build FFmpeg WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive       # FFmpeg-WASI submodule'ü çek

      - name: Build FFmpeg WASM
        run: |
          chmod +x build-ffmpeg.sh
          ./build-ffmpeg.sh

      - name: Upload WASM binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-wasm-binaries
          path: binaries/             # ffmpeg.py'nin baktığı BINARIES_DIR
          if-no-files-found: error

  # ── Platform build'leri ───────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: build-ffmpeg-wasm          # WASM hazır olmadan başlama
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            build_cmd: "flet build linux"
            artifact_path: build/linux
            needs_linux_deps: true

          - name: macos
            runner: macos-latest
            build_cmd: "flet build macos"
            artifact_path: build/macos
            needs_linux_deps: false

          - name: windows
            runner: windows-latest
            build_cmd: "flet build windows"
            artifact_path: build/windows
            needs_linux_deps: false

          - name: aab
            runner: ubuntu-latest
            build_cmd: "flet build aab"
            artifact_path: build/aab
            needs_linux_deps: false

          - name: apk
            runner: ubuntu-latest
            build_cmd: "flet build apk"
            artifact_path: build/apk
            needs_linux_deps: false

          - name: ipa
            runner: macos-latest
            build_cmd: "flet build ipa"
            artifact_path: build/ipa
            needs_linux_deps: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download FFmpeg WASM binaries
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-wasm-binaries
          path: binaries/             # ffmpeg.py'deki BINARIES_DIR ile eşleşmeli

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build libgtk-3-dev libasound2-dev libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x \
            gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 \
            gstreamer1.0-qt5 gstreamer1.0-pulseaudio \
            pkg-config libsecret-1-0 libsecret-1-dev
          sudo apt-get clean

      - name: Build app
        shell: bash
        run: uv run ${{ matrix.build_cmd }} --yes --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # ffmpeg-wasm-binaries artifact'ı da iner, filtrele:
          pattern: "*-build-artifact"

      - name: Zip each artifact
        shell: bash
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            [[ "$name" == "aab-build-artifact" ]] && continue
            zip -r "../${name}.zip" "$dir"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: "*.zip"