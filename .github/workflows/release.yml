name: Build Flet App

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UV_PYTHON: 3.13
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:

  # ── FFmpeg WASM build (cached) ────────────────────────────────────────────
  build-ffmpeg-wasm:
    name: Build FFmpeg WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get FFmpeg submodule hash
        id: ffmpeg-hash
        run: echo "hash=$(git submodule status | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Cache FFmpeg WASM binaries
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: binaries/
          key: ffmpeg-wasm-${{ runner.os }}-${{ steps.ffmpeg-hash.outputs.hash }}-${{ hashFiles('build-ffmpeg.sh') }}

      - name: Build FFmpeg WASM
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          chmod +x build-ffmpeg.sh
          ./build-ffmpeg.sh

      - name: Upload WASM binaries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-wasm-binaries
          path: binaries/
          if-no-files-found: error

  # ── Platform build'leri ───────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: build-ffmpeg-wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            build_cmd: "flet build linux"
            artifact_path: build/linux
            needs_linux_deps: true

          - name: macos
            runner: macos-latest
            build_cmd: "flet build macos"
            artifact_path: build/macos
            needs_linux_deps: false

          - name: windows
            runner: windows-latest
            build_cmd: "flet build windows"
            artifact_path: build/windows
            needs_linux_deps: false

          - name: aab
            runner: ubuntu-latest
            build_cmd: "flet build aab"
            artifact_path: build/aab
            needs_linux_deps: false

          - name: apk
            runner: ubuntu-latest
            build_cmd: "flet build apk"
            artifact_path: build/apk
            needs_linux_deps: false

          - name: ipa
            runner: macos-latest
            build_cmd: "flet build ipa"
            artifact_path: build/ipa
            needs_linux_deps: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download FFmpeg WASM binaries
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-wasm-binaries
          path: binaries/

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build libgtk-3-dev libasound2-dev libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x \
            gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 \
            gstreamer1.0-qt5 gstreamer1.0-pulseaudio \
            pkg-config libsecret-1-0 libsecret-1-dev
          sudo apt-get clean

      - name: Build app
        shell: bash
        run: uv run ${{ matrix.build_cmd }} --yes --verbose

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changelog commits
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${{ github.ref_name }})
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${{ github.ref_name }})
          fi
          cat > /tmp/release-commits.md << 'EOF'
          ${{ github.ref_name }} sürümü commit'leri:
          $COMMITS
          EOF

      - name: Generate release notes with OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/qwen3.6-plus-free
          prompt: |
            /tmp/release-commits.md dosyasındaki commit'lere dayanarak Türkçe sürüm notları oluştur.
            Commitleri anlamlı başlıklar altında grupla (Yeni Özellikler, Hata Düzeltmeleri, İyileştirmeler vb.).
            Teknik terimleri sadeleştir. Yalnızca sürüm notlarını yaz, başka hiçbir şey ekleme.
            Sonucu /tmp/release-notes.md dosyasına yaz.

      - name: Read generated release notes
        id: ai-notes
        run: |
          NOTES=$(cat /tmp/release-notes.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ github.ref_name }}"
          DATE=$(date +'%Y-%m-%d')
          NOTES=$(cat << 'NOTES_EOF'
          ${{ steps.ai-notes.outputs.notes }}
          NOTES_EOF
          )

          NEW_ENTRY="## [$VERSION] - $DATE\n\n$NOTES\n\n---\n"

          if [ ! -f CHANGELOG.md ]; then
            printf "# Changelog\n\nBu dosya her sürümde otomatik olarak güncellenir.\n\n---\n\n${NEW_ENTRY}" > CHANGELOG.md
          else
            # Yeni sürümü mevcut içeriğin başına ekle
            EXISTING=$(cat CHANGELOG.md)
            printf "%s\n\n%s" "$EXISTING" "" > /dev/null  # flush
            awk -v entry="$NEW_ENTRY" '
              /^---$/ && !inserted {
                print
                print ""
                printf "%s", entry
                inserted=1
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          fi

      - name: Commit and push CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: ${{ github.ref_name }} sürüm notları CHANGELOG.md'ye eklendi [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-build-artifact"

      - name: Zip each artifact
        shell: bash
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            [[ "$name" == "aab-build-artifact" ]] && continue
            zip -r "../${name}.zip" "$dir"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.ai-notes.outputs.notes }}
          draft: false
          prerelease: false
          files: "*.zip"
